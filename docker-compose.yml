services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ozu_running_club_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URI=postgres://postgres:${POSTGRES_PASSWORD:-ozu_running_secret}@db:5432/ozu_running_db
      - PAYLOAD_SECRET=${PAYLOAD_SECRET:-8f83c18c7e92384a6b29d891b988f910}
      - NEXT_PUBLIC_SERVER_URL=${NEXT_PUBLIC_SERVER_URL:-http://localhost:3000}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: ozu_running_club_db
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: ozu_running_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ozu_running_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ozu_running_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
